[project]
name = "ytrag"
version = "0.1.0"
description = "Production Grounded RAG Research Assistant for YouTube Videos with Exact Timestamp Citations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vishesh Shah" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "chromadb>=0.5.0",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "youtube-transcript-api>=0.6.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
